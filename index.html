<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه جامع بازرسی HSE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-blue-800 text-white py-4 px-6 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold">سامانه جامع بازرسی و ممیزی HSE</h1>
            <button id="exportExcelBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm transition font-medium flex items-center gap-2">
                📊 خروجی اکسل کلی
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">

        <!-- انتخاب چک‌لیست -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
            <label for="checklistSelect" class="block text-gray-700 font-bold mb-2">نوع چک‌لیست بازرسی را انتخاب کنید:</label>
            <select id="checklistSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
                <option value="">-- لطفاً یک چک‌لیست انتخاب کنید --</option>
                <optgroup label="آشپزخانه و غذاخوری">
                    <option value="kitchen">آشپزخانه و غذاخوری (۱۸ بند)</option>
                </optgroup>
                <optgroup label="ایمنی برق تخصصی">
                    <option value="elec_panel">تابلوهای برق اصلی و فرعی</option>
                    <option value="elec_substation">پست‌های توزیع و ترانسفورماتورها</option>
                    <option value="elec_portable">ابزارها و تجهیزات برقی پرتابل</option>
                    <option value="elec_general">ایمنی عمومی برق و ارتینگ محیطی</option>
                </optgroup>
                <optgroup label="تجهیزات اعلام و اطفای حریق">
                    <option value="fire_ext">کپسول‌های خاموش‌کننده حریق</option>
                    <option value="fire_box">جعبه‌های آتش‌نشانی و هوزریل</option>
                </optgroup>
            </select>
        </section>

        <!-- فرم ثبت بازرسی -->
        <form id="inspectionForm" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-6">
            
            <h2 id="formTitle" class="text-lg font-bold text-blue-800 border-b pb-2">عنوان چک‌لیست</h2>

            <!-- اطلاعات سربرگ -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-lg">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">تاریخ بازرسی *</label>
                    <input type="date" id="inspDate" required class="w-full p-2 border rounded-md text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">نام بازرس *</label>
                    <input type="text" id="inspectorName" required placeholder="مثال: مهندس کاوندی" class="w-full p-2 border rounded-md text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">کد تجهیز / Tag ID *</label>
                    <input type="text" id="equipmentCode" required placeholder="مثال: TR-01 یا PNL-B2" class="w-full p-2 border rounded-md text-sm font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">محل / واحد *</label>
                    <input type="text" id="location" required placeholder="مثال: سالن تولید / پست برق" class="w-full p-2 border rounded-md text-sm">
                </div>
            </div>

            <!-- آیتم‌های چک‌لیست (داینامیک) -->
            <div id="checklistItems" class="space-y-4"></div>

            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow transition">
                💾 ثبت نهایی بازرسی
            </button>
        </form>

        <!-- داشبورد تحلیل و نمودارها -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-6">
            <h2 class="text-lg font-bold text-gray-800 border-b pb-2">📊 گزارش تحلیلی و نمودار وضعیت</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h3 class="text-sm font-semibold text-gray-600 mb-3 text-center">وضعیت کلی ان
